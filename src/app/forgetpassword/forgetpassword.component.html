<div class="forgot-container" [formGroup]="forgotForm">

  <mat-card>
    <h2>Forgot Password</h2>

    <!-- Email Field -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email is required</mat-error>
      <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Invalid email format</mat-error>
    </mat-form-field>

    <!-- Mobile Field -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Mobile Number</mat-label>
      <input matInput type="tel" formControlName="mobile" />
      <mat-error *ngIf="forgotForm.get('mobile')?.hasError('required')">Mobile is required</mat-error>
      <mat-error *ngIf="forgotForm.get('mobile')?.hasError('pattern')">Enter valid 10-digit mobile</mat-error>
    </mat-form-field>

    <!-- Verify Button -->
    <button mat-raised-button color="primary" (click)="verifyUser()">Verify</button>

    <!-- Password Fields (Shown After Verification) -->
    <div *ngIf="showPasswordFields" class="mt-20">

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>New Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" formControlName="confirmPassword" />
      </mat-form-field>

      <button mat-raised-button color="accent" (click)="resetPassword()">Reset Password</button>

    </div>
  </mat-card>

</div>
